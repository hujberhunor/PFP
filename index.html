<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Költségkövető</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-mode">
    <h2>Költségkövető</h2>
    <section id="view-week" class="view active">
        <h3>Heti maradvány</h3>
        <div id="week-label" class="period-label"></div>
        <div id="stats-week"></div>

        <h3>Új kiadás</h3>
        <form id="expense-form" class="stack" style="margin-top:10px;">
            <input type="number" id="amount" placeholder="Összeg (Ft)" inputmode="numeric" enterkeyhint="next">
            <select id="category-select"></select>
            <input type="text" id="note" placeholder="Megjegyzés (pl. kifli, jegy, pizza)" enterkeyhint="done">
            <button class="action-btn" type="submit">Hozzáadás</button>
        </form>
        <button class="action-btn" style="margin-top:10px;" onclick="exportCSV()">CSV Export</button>
    </section>

    <section id="view-month" class="view">
        <h3>Havi maradvány</h3>
        <div id="month-label" class="period-label"></div>
        <div id="stats-month"></div>
        <h3>Nyers adatok</h3>
        <div class="table-wrap">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Description</th>
                        <th>Date</th>
                        <th>Acc</th>
                    </tr>
                </thead>
                <tbody id="month-raw"></tbody>
            </table>
        </div>
    </section>

    <section id="view-settings" class="view">
        <h3>Beállítások</h3>
        <div class="settings-header">
            <div class="cat-name">Kategória</div>
            <div class="limit-col">Havi limit (Ft)</div>
        </div>
        <div class="period-label">Heti limit automatikus a havi alapján.</div>
        <div id="settings-list"></div>
        <div class="card stack" style="margin-top:12px;">
            <strong>Új kategória</strong>
            <input type="text" id="new-cat-name" placeholder="Új kategória (pl. 🍞 Pékáru)">
            <input type="number" id="new-cat-monthly" placeholder="Havi limit (Ft)">
            <button class="action-btn" onclick="addCategory()">Kategória hozzáadása</button>
        </div>
        <button class="action-btn" style="margin-top:10px;" onclick="saveSettings()">Beállítások mentése</button>
    </section>

    <div class="nav">
        <div class="nav-inner">
            <button class="nav-btn active" data-view="week">Hét</button>
            <button class="nav-btn" data-view="month">Hónap</button>
            <button class="nav-btn" data-view="settings">Beállítások</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
